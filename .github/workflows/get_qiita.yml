name: Run Qiita API test

on:
  schedule:
    # Every Friday at 00:00 UTC
    - cron: "0 0 * * 5"
  workflow_dispatch:

jobs:
  run-api-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run get_api_test.ts
        run: npx tsx get_api_test.ts
